<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02140d" />
      <stop offset="60%" stop-color="#063220" />
      <stop offset="100%" stop-color="#0b4d32" />
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="glowOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />
  
  <!-- Glowing Center Orbs -->
  <circle cx="960" cy="540" r="600" fill="url(#glowOrb)" />
  <circle cx="400" cy="300" r="300" fill="url(#glowOrb)" opacity="0.6" />
  <circle cx="1500" cy="400" r="400" fill="url(#glowOrb)" opacity="0.6" />

  <!-- Perspective Agricultural Rows (Paddy Field Lines) -->
  <g stroke="#10b981" stroke-opacity="0.25" stroke-width="2">
    <line x1="0" y1="1080" x2="960" y2="500" />
    <line x1="200" y1="1080" x2="960" y2="500" />
    <line x1="400" y1="1080" x2="960" y2="500" />
    <line x1="600" y1="1080" x2="960" y2="500" />
    <line x1="800" y1="1080" x2="960" y2="500" />
    <line x1="1000" y1="1080" x2="960" y2="500" />
    <line x1="1200" y1="1080" x2="960" y2="500" />
    <line x1="1400" y1="1080" x2="960" y2="500" />
    <line x1="1600" y1="1080" x2="960" y2="500" />
    <line x1="1800" y1="1080" x2="960" y2="500" />
    <line x1="1920" y1="1080" x2="960" y2="500" />
  </g>

  <!-- Horizon Curves (Rolling Farm Hills) -->
  <path d="M0 650 Q 480 580, 960 620 T 1920 600 V 1080 H 0 Z" fill="url(#fieldGrad)" opacity="0.8" />
  <path d="M0 720 Q 480 670, 960 700 T 1920 680 V 1080 H 0 Z" fill="#043829" opacity="0.9" />

  <!-- Tech Nodes (IoT Sensors in Field) -->
  <g fill="#34d399">
    <circle cx="960" cy="500" r="8" />
    <circle cx="700" cy="680" r="6" />
    <circle cx="1220" cy="670" r="6" />
    <circle cx="450" cy="780" r="7" />
    <circle cx="1470" cy="790" r="7" />
    <circle cx="850" cy="850" r="9" />
    <circle cx="1100" cy="860" r="9" />
  </g>

  <!-- Pulse Rings around Sensors -->
  <g stroke="#34d399" stroke-width="1.5" fill="none" opacity="0.6">
    <circle cx="850" cy="850" r="22" stroke-dasharray="4 2" />
    <circle cx="1100" cy="860" r="26" stroke-dasharray="6 3" />
    <circle cx="960" cy="500" r="18" />
  </g>
</svg>
